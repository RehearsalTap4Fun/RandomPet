</style><header><h1>异变批次 1 · 18 个代表样本</h1><p>18 个样本渲染与回放检查 · 其中 6 个旧样本与历史像素一致 · 本批五件新素材已通过人工验收。缩略图为实际 200px。</p><nav><a href="/">返回工作台</a><select id="coat"><option value="">全部花纹</option></select><select id="mutation"><option value="">全部异变</option></select><button id="theme">深浅背景</button><button id="prev">上一页</button><button id="next">下一页</button><span id="count"></span></nav></header><main></main><dialog><button onclick="this.parentElement.close()">关闭</button><img><p></p></dialog><footer>每页 72 张；放大预览基于 200px 图，原生图请在工作台导入同选项后查看。</footer><script>
const data=[{"index":1,"coat":"orange-white","expression":"parted-mouth","crown":"halo","ears":"none","neck":"none","back":"none","tailTip":"none"},{"index":2,"coat":"orange-white","expression":"parted-mouth","crown":"none","ears":"none","neck":"none","back":"dragon-wings","tailTip":"none"},{"index":3,"coat":"orange-white","expression":"parted-mouth","crown":"none","ears":"none","neck":"none","back":"feathered-wings","tailTip":"none"},{"index":4,"coat":"orange-white","expression":"parted-mouth","crown":"none","ears":"none","neck":"frill-neck","back":"none","tailTip":"none"},{"index":5,"coat":"orange-white","expression":"parted-mouth","crown":"none","ears":"none","neck":"none","back":"none","tailTip":"flame-tail"},{"index":6,"coat":"tuxedo","expression":"parted-mouth","crown":"halo","ears":"none","neck":"none","back":"none","tailTip":"none"},{"index":7,"coat":"tuxedo","expression":"parted-mouth","crown":"none","ears":"none","neck":"none","back":"dragon-wings","tailTip":"none"},{"index":8,"coat":"tuxedo","expression":"parted-mouth","crown":"none","ears":"none","neck":"none","back":"feathered-wings","tailTip":"none"},{"index":9,"coat":"tuxedo","expression":"parted-mouth","crown":"none","ears":"none","neck":"frill-neck","back":"none","tailTip":"none"},{"index":10,"coat":"tuxedo","expression":"parted-mouth","crown":"none","ears":"none","neck":"none","back":"none","tailTip":"flame-tail"},{"index":11,"coat":"colorpoint","expression":"small-fangs","crown":"halo","ears":"fin-ears","neck":"frill-neck","back":"dragon-wings","tailTip":"flame-tail"},{"index":12,"coat":"rosetted","expression":"tongue-tip","crown":"antlers","ears":"none","neck":"small-lion-mane","back":"feathered-wings","tailTip":"flame-tail"},{"index":13,"coat":"brown-tabby","expression":"parted-mouth","crown":"antlers","ears":"none","neck":"small-lion-mane","back":"none","tailTip":"forked-tail-tip"},{"index":14,"coat":"orange-white","expression":"small-fangs","crown":"antlers","ears":"none","neck":"small-lion-mane","back":"none","tailTip":"forked-tail-tip"},{"index":15,"coat":"tuxedo","expression":"tongue-tip","crown":"antlers","ears":"none","neck":"small-lion-mane","back":"none","tailTip":"forked-tail-tip"},{"index":16,"coat":"calico","expression":"parted-mouth","crown":"antlers","ears":"none","neck":"small-lion-mane","back":"none","tailTip":"forked-tail-tip"},{"index":17,"coat":"colorpoint","expression":"small-fangs","crown":"antlers","ears":"none","neck":"small-lion-mane","back":"none","tailTip":"forked-tail-tip"},{"index":18,"coat":"rosetted","expression":"tongue-tip","crown":"antlers","ears":"none","neck":"small-lion-mane","back":"none","tailTip":"forked-tail-tip"}],slots=['crown','ears','neck','back','tailTip'],coat=document.querySelector('#coat'),mutation=document.querySelector('#mutation');let page=0;for(const x of [...new Set(data.map(s=>s.coat))])coat.add(new Option(x,x));for(const x of [...new Set(data.flatMap(s=>slots.map(k=>s[k])))].filter(x=>x!=='none'))mutation.add(new Option(x,x));function render(){const filtered=data.filter(s=>(!coat.value||s.coat===coat.value)&&(!mutation.value||slots.some(k=>s[k]===mutation.value))),pages=Math.ceil(filtered.length/72);page=Math.max(0,Math.min(page,pages-1));document.querySelector('main').innerHTML=filtered.slice(page*72,(page+1)*72).map(s=>'<article><img loading="lazy" src="representative-renders/'+String(s.index).padStart(4,'0')+'.webp"><b>'+s.index+' · '+s.coat+'</b><small>'+s.expression+'</small><small>'+slots.filter(k=>s[k]!=='none').map(k=>s[k]).join(' · ')+'</small></article>').join('');document.querySelector('#count').textContent=(page+1)+' / '+pages+' 页 · '+filtered.length+' 组合';document.querySelectorAll('article').forEach(a=>a.onclick=()=>{const d=document.querySelector('dialog');d.querySelector('img').src=a.querySelector('img').src;d.querySelector('p').textContent=a.innerText;d.showModal()});}coat.onchange=mutation.onchange=()=>{page=0;render()};document.querySelector('#prev').onclick=()=>{page--;render()};document.querySelector('#next').onclick=()=>{page++;render()};document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');render();</script></html>
